<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RR Clutch Index</title>
<style>
:root{
  --bg:#0a0e1f; --surface:#121936; --surface2:#1a2349; --surface3:#232e5c; --border:#34427f;
  --text:#f1f3fb; --muted:#b4bde0; --faint:#8a95c4;
  --pink:#E4007C; --pink-l:#ff6db6; --blue:#254AA5; --blue-l:#8fb0ff; --amber:#ffc85a; --grey:#8d94b3;
  --ok:#59d6a2; --bad:#ff8a8a;
  --r:12px; --gut:16px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow-x:hidden}
h1,h2,h3,h4{line-height:1.25;margin:0 0 .4em}
h1{font-size:1.45rem} h2{font-size:1.3rem} h3{font-size:1.1rem} h4{font-size:1rem}
p{margin:.4em 0 .7em}
a{color:var(--blue-l)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1200px;margin:0 auto;padding:0 var(--gut)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

/* header + nav */
.top{padding:12px 0 8px;border-bottom:1px solid var(--border);background:linear-gradient(90deg,rgba(228,0,124,.22),rgba(37,74,165,.3))}
.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{flex:1 1 220px;min-width:0}
.brand b{font-size:1.2rem;letter-spacing:.2px}
.brand small{display:block;color:var(--muted);font-size:.9rem}
.seg{display:inline-flex;border:2px solid var(--border);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;min-height:44px;min-width:44px;padding:0 14px;color:var(--muted);font-weight:600}
.seg button[aria-pressed=true]{background:var(--pink);color:#fff}
.seg button[aria-pressed=true]::before{content:"\2713 "}
.btn{min-height:44px;min-width:44px;padding:0 16px;border-radius:10px;border:2px solid var(--border);background:var(--surface2);font-weight:600}
.btn:hover{border-color:var(--blue-l)}
.btn.pri{background:var(--pink);border-color:var(--pink);color:#fff}
.btn.sm{min-height:44px;padding:0 12px}
.honest{background:#2a1f10;border-bottom:1px solid #6b4d1a;color:#ffe6b3;font-size:.95rem}
.honest .wrap{padding-top:8px;padding-bottom:8px}
.sticky{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--border)}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:6px var(--gut);scrollbar-width:thin;max-width:1200px;margin:0 auto}
.tabs button{flex:0 0 auto;min-height:44px;padding:0 14px;border:2px solid transparent;border-radius:10px;background:transparent;color:var(--muted);font-weight:600;white-space:nowrap}
.tabs button[aria-selected=true]{background:var(--surface2);border-color:var(--pink);color:#fff}
.tabs button .n{color:var(--pink-l);margin-right:4px}

/* filters */
.fbar{background:var(--surface);border-top:1px solid var(--border)}
.fgrid{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:flex-end;padding:8px 0}
.fld{display:flex;flex-direction:column;gap:2px;min-width:120px;flex:1 1 130px}
.fld label{font-size:.8rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.fld select,.fld input[type=search]{min-height:44px;background:var(--surface2);border:2px solid var(--border);border-radius:10px;padding:0 10px;width:100%}
.chk{display:flex;align-items:center;gap:8px;min-height:44px;flex:1 1 220px;font-size:.95rem}
.chk input{width:24px;height:24px;accent-color:var(--pink)}
.fnote{font-size:.85rem;color:var(--muted);padding:0 0 8px;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:6px 0;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface3);border:1px solid var(--border);border-radius:999px;padding:4px 12px;font-size:.9rem}
.fhead{display:none}
#fbtn{display:none}
@media (max-width:899px){
  #fbtn{display:inline-flex;align-items:center;justify-content:center}
  .fbar{display:none;position:fixed;left:0;right:0;bottom:0;top:auto;max-height:86vh;overflow:auto;z-index:60;border-top:3px solid var(--pink);border-radius:18px 18px 0 0;padding:0 var(--gut) 16px;box-shadow:0 -10px 40px rgba(0,0,0,.6)}
  .fbar.open{display:block}
  .fhead{display:flex;align-items:center;justify-content:space-between;padding:12px 0 0}
  .fgrid{flex-direction:column;align-items:stretch}
  .fld{flex:0 0 auto}
  #scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:55;display:none}
  #scrim.on{display:block}
}
.activebar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:6px var(--gut);max-width:1200px;margin:0 auto}

/* main */
main{padding:16px 0 40px;min-height:60vh}
.sec{margin:0 0 28px}
.lead{font-size:1.15rem;font-weight:600;line-height:1.4;margin:0 0 12px;max-width:62ch}
.lead em{color:var(--pink-l);font-style:normal}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;min-width:0}
.card.hl{border-color:var(--pink);box-shadow:0 0 0 1px var(--pink) inset}
.tile .v{font-size:1.7rem;font-weight:800;line-height:1.1}
.tile .l{color:var(--muted);font-size:.9rem}
.tile.warn{border-color:var(--amber)}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.small{font-size:.9rem}
.sowhat{margin:10px 0 0;padding:8px 12px;border-left:4px solid var(--pink);background:rgba(228,0,124,.1);border-radius:0 8px 8px 0;font-size:1rem}
.sowhat b{color:var(--pink-l)}
.note{padding:8px 12px;border-radius:8px;background:rgba(255,200,90,.1);border:1px solid #6b4d1a;color:#ffe6b3;font-size:.95rem;margin:8px 0}
.empty{padding:20px;border:2px dashed var(--border);border-radius:var(--r);text-align:center;color:var(--muted)}
.tag{display:inline-block;padding:1px 8px;border-radius:6px;font-size:.78rem;font-weight:700;letter-spacing:.2px;border:1px solid;vertical-align:middle;white-space:nowrap;margin:0 2px}
.tag.assume{color:var(--amber);border-color:var(--amber);background:rgba(255,200,90,.08)}
.tag.warn{color:#ffd0d0;border-color:var(--bad);background:rgba(255,138,138,.1)}
.tag.info{color:var(--blue-l);border-color:var(--blue-l);background:rgba(143,176,255,.08)}
.tag.good{color:var(--ok);border-color:var(--ok)}
.unk{color:var(--amber);font-weight:700}
.shape{display:inline-block;width:1.1em;text-align:center}
.t-must{color:var(--pink-l)} .t-value{color:var(--blue-l)} .t-gem{color:var(--amber)}
.i{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;min-width:24px;border-radius:50%;border:1.5px solid var(--blue-l);background:transparent;color:var(--blue-l);font-size:.8rem;font-weight:700;padding:0;margin-left:4px;vertical-align:middle;position:relative}
.i::after{content:"";position:absolute;inset:-10px}
.plink{background:none;border:0;padding:0;color:var(--blue-l);font-weight:700;text-decoration:underline;text-underline-offset:3px;text-align:left;min-height:28px;cursor:pointer}
.plink:hover{color:var(--pink-l)}
ul.clean{list-style:none;padding:0;margin:0}
ul.clean li{padding:4px 0}

/* charts */
.chart{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;min-width:0}
.ct{font-size:1.1rem;font-weight:700;margin:0}
.cs{color:var(--muted);font-size:.92rem;margin:2px 0 8px}
.svgw{overflow-x:auto;max-width:100%}
svg.svg{display:block;max-width:100%;height:auto}
svg text{fill:var(--text);font-family:inherit}
svg .ax{fill:var(--muted);font-size:11.5px}
svg .axl{fill:var(--muted);font-size:12px;font-weight:600}
svg .gl{stroke:var(--border);stroke-width:1}
svg .dim{fill:var(--faint)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.9rem;color:var(--muted);margin:8px 0 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend svg{flex:none}
.axcap{font-size:.85rem;color:var(--muted);font-weight:600;margin:0 0 4px}
.nline{font-size:.88rem;color:var(--faint);margin:6px 0 0}
.wrow{padding:6px 0;border-bottom:1px solid rgba(52,66,127,.5)}
.wrow.small-s{opacity:.62}
.wrow .wh{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.wrow .wm{font-size:.85rem;color:var(--muted)}
.hit{cursor:pointer}

/* tables */
.tw{overflow-x:auto;max-width:100%;border:1px solid var(--border);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{padding:8px 10px;text-align:left;vertical-align:top;border-bottom:1px solid rgba(52,66,127,.6)}
th{background:var(--surface2);font-weight:700;white-space:nowrap;position:sticky;top:0}
th button{background:none;border:0;font-weight:700;padding:0;min-height:44px;color:inherit;text-align:left}
tr.small-s td{opacity:.6}
td.num,th.num{text-align:right;white-space:nowrap}
.lbbar{min-width:210px}
td.name{min-width:210px}
@media (max-width:759px){
  table.rt,table.rt tbody,table.rt tr,table.rt td{display:block;width:100%}
  table.rt thead{display:none}
  table.rt tr{border:1px solid var(--border);border-radius:var(--r);margin:0 0 10px;padding:8px 10px;background:var(--surface)}
  table.rt td{border:0;padding:4px 0 4px 42%;display:block;position:relative;text-align:left!important;min-height:28px;overflow-wrap:anywhere}
  table.rt td::before{content:attr(data-l);position:absolute;left:0;top:4px;width:38%;color:var(--muted);font-size:.85rem;font-weight:600}
  table.rt td.full{padding-left:0}
  table.rt td.full::before{position:static;display:block;width:auto;margin-bottom:2px}
  table.rt .tag{white-space:normal}
  table.rt td.name{font-size:1.05rem}
  .tw:has(> table.rt){border:0;overflow:visible}
  .lb-row{position:relative}
  .lb-row td.rk{position:absolute;top:8px;right:12px;padding:0;width:auto;min-height:0;font-weight:800;font-size:1.15rem}
  .lb-row td.rk::before{position:static;display:inline;content:'Rank ';font-size:.85rem;font-weight:600}
  .lb-row td.name{padding-right:70px}
  .lb-row td.name::before,.lb-row td.lbbar::before{display:none}
  .lbbar{min-width:0}
}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px}
.tools select{min-height:44px;background:var(--surface2);border:2px solid var(--border);border-radius:10px;padding:0 10px}

/* details (deep layer) */
details.deep{background:var(--surface);border:1px dashed var(--border);border-radius:var(--r);margin:12px 0;padding:0}
details.deep>summary{min-height:44px;display:flex;align-items:center;padding:0 14px;cursor:pointer;font-weight:700;color:var(--blue-l);list-style:none}
details.deep>summary::before{content:"\25B8";margin-right:8px;color:var(--pink-l)}
details.deep[open]>summary::before{content:"\25BE"}
details.deep>.dbody{padding:0 14px 14px}

/* tiers */
.tiers{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr))}
.tcol h3{display:flex;align-items:center;gap:8px}
.pcard{border:1px solid var(--border);border-radius:var(--r);padding:12px;background:var(--surface2);margin:0 0 10px}
.pcard .pn{font-size:1.05rem;font-weight:700}
.pcard dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:8px 0 0;font-size:.92rem}
.pcard dt{color:var(--muted)} .pcard dd{margin:0}
.kv{display:grid;grid-template-columns:minmax(110px,max-content) 1fr;gap:4px 12px;font-size:.95rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
@media (max-width:560px){.kv{grid-template-columns:1fr;gap:0}.kv dt{font-weight:700;margin-top:8px}.kv dd{margin-bottom:2px}}
#card .ph .btn{white-space:nowrap}

/* flow */
.flow{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));counter-reset:f}
.flow div{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px;font-size:.92rem;position:relative}
.flow div::before{counter-increment:f;content:counter(f);display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--pink);color:#fff;align-items:center;justify-content:center;font-weight:800;margin-bottom:4px}

/* profile card */
#card{position:fixed;inset:0;z-index:80;display:none}
#card.on{display:block}
#card .bd{position:absolute;inset:0;background:rgba(0,0,0,.65)}
#card .panel{position:absolute;top:0;right:0;bottom:0;width:min(100%,760px);background:var(--bg);border-left:2px solid var(--pink);overflow-y:auto;padding:0 var(--gut) 40px;overscroll-behavior:contain}
#card .ph{position:sticky;top:0;background:var(--bg);z-index:2;padding:12px 0 8px;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
#card .ph h2{margin:0}
.dial{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.dial .big{font-size:2.6rem;font-weight:800;line-height:1}
.dial-score,.dial-range{font-variant-numeric:tabular-nums}
.hvl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hvl .card{padding:10px}
.vs{font-size:.95rem}
.vs dl{display:grid;grid-template-columns:1fr auto;gap:2px 8px;margin:0}
.vs dt{color:var(--muted)} .vs dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.rcpt{border-left:4px solid var(--blue-l);padding:6px 10px;margin:0 0 8px;background:var(--surface);border-radius:0 8px 8px 0}

/* compare */
.pickers{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 10px}
.pickers select{min-height:44px;background:var(--surface2);border:2px solid var(--border);border-radius:10px;padding:0 10px;max-width:100%}
.ptag{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--border);background:var(--surface2);border-radius:999px;padding:2px 4px 2px 12px;min-height:44px}
.ptag button.x{width:36px;height:36px;border-radius:50%;border:0;background:var(--surface3);color:var(--text);font-weight:800}

/* squad / basket */
.meter{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.warnbox{border:2px solid var(--bad);background:rgba(255,138,138,.1);padding:8px 12px;border-radius:10px;margin:6px 0}
.okbox{border:2px solid var(--ok);background:rgba(89,214,162,.08);padding:8px 12px;border-radius:10px;margin:6px 0}
.mi{display:flex;gap:10px;align-items:center;justify-content:space-between;min-height:44px;border-bottom:1px solid var(--border)}

/* tooltip */
#tip{position:fixed;z-index:100;max-width:min(320px,calc(100vw - 24px));background:#0d1330;border:2px solid var(--blue-l);color:var(--text);padding:8px 12px;border-radius:10px;font-size:.92rem;line-height:1.4;display:none;box-shadow:0 8px 24px rgba(0,0,0,.6);pointer-events:none}
#tip.on{display:block}
footer{border-top:1px solid var(--border);padding:20px 0 60px;color:var(--muted);font-size:.9rem;background:var(--surface)}
footer p{margin:.3em 0}
input[type=range]{width:100%;min-height:44px;accent-color:var(--pink)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem;overflow-wrap:anywhere}
@media (min-width:900px){
  h1{font-size:1.7rem}
  .lead{font-size:1.25rem}
  .fgrid .fld{flex:0 1 150px}
}
body:not(.detailed) .deepc{display:none !important}
@media print{.sticky,#card,#tip{display:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <pattern id="p-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#254AA5"/><line x1="0" y1="0" x2="0" y2="6" stroke="#8fb0ff" stroke-width="2.2"/></pattern>
    <pattern id="p-dots" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#4a5280"/><circle cx="3" cy="3" r="1.3" fill="#c3c9e6"/></pattern>
    <pattern id="p-pink" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#E4007C"/></pattern>
    <pattern id="p-grey" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="6" height="6" fill="#3a4170"/><line x1="0" y1="0" x2="0" y2="6" stroke="#8d94b3" stroke-width="1.6"/></pattern>
    <pattern id="p-amber" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#7a5a14"/><line x1="0" y1="3" x2="6" y2="3" stroke="#ffc85a" stroke-width="1.6"/></pattern>
  </defs>
</svg>
<a class="sr" href="#view">Skip to content</a>
<header class="top">
  <div class="wrap">
    <div class="brand"><b id="brand-name"></b><small id="brand-thesis"></small></div>
    <div class="seg" role="group" aria-label="Detail level">
      <button id="mode-simple" type="button" aria-pressed="true">Simple</button>
      <button id="mode-detail" type="button" aria-pressed="false">Detailed</button>
    </div>
    <button id="fbtn" class="btn" type="button" aria-expanded="false" aria-controls="fbar">Filters <span id="fcount" class="tag info" style="margin-left:6px">0</span></button>
  </div>
</header>
<div class="honest"><div class="wrap" id="honest"></div></div>
<div class="sticky" id="sticky">
  <nav class="tabs" id="tabs" role="tablist" aria-label="Dashboard sections"></nav>
  <div class="activebar" id="activebar" aria-live="polite"></div>
  <div id="scrim"></div>
  <div class="fbar" id="fbar">
    <div class="wrap">
      <div class="fhead"><b>Filters</b><button type="button" class="btn sm" id="fclose">Done</button></div>
      <div class="fgrid">
        <div class="fld"><label for="f-role">Role</label><select id="f-role"><option value="all">All roles</option><option value="bat">Batters</option><option value="bowl">Bowlers</option><option value="ar">All-rounders</option></select></div>
        <div class="fld"><label for="f-phase">Phase</label><select id="f-phase"><option value="all">All phases</option><option value="P">Powerplay (1-6)</option><option value="M">Middle (7-15)</option><option value="D">Death (16-20)</option></select></div>
        <div class="fld"><label for="f-season">Season</label><select id="f-season"></select></div>
        <div class="fld"><label for="f-pressure">Pressure level</label><select id="f-pressure"><option value="all">All levels</option><option value="H">High</option><option value="M">Medium</option><option value="L">Low</option></select></div>
        <div class="fld"><label for="f-origin">Indian / overseas</label><select id="f-origin"><option value="all">All</option><option value="ind">Indian</option><option value="ovs">Overseas</option><option value="unk">Unknown</option></select></div>
        <div class="fld"><label for="f-q">Search player</label><input id="f-q" type="search" placeholder="Name" autocomplete="off"></div>
        <label class="chk"><input id="f-avail" type="checkbox"><span>Available at auction only <button type="button" class="i" id="avail-i" aria-label="What this toggle does">i</button></span></label>
        <button type="button" class="btn" id="f-reset">Reset filters</button>
      </div>
      <p class="fnote" id="fnote"></p>
    </div>
  </div>
</div>
<main><div class="wrap" id="view" tabindex="-1"></div></main>
<footer><div class="wrap" id="foot"></div></footer>
<div id="card" role="dialog" aria-modal="true" aria-label="Player profile"><div class="bd" data-act="close-card"></div><div class="panel" id="cardpanel"></div></div>
<div id="tip" role="tooltip"></div>
<script>
'use strict';
/* ===================== DATA (injected at build time; nothing below types a statistic) ===================== */
const D = /*__PAYLOAD__*/{};

/* Display rules only (not statistics): thresholds used to grey / tag things. */
const CFG = {
  wideRange: 55,      // score range wider than this many points = wide, greyed + tagged
  modRange: 36,       // 36-55 = moderate (wording only)
  smallSlice: 30,     // filtered slice with fewer balls than this = "small slice"
  minCell: 30,        // heatmap cells with fewer balls are hatched
  smallPhase: 100,    // phase-strength balls below this are tagged small
  recent: '2025–26', // window used by the pipeline for RR gap / phase strength (step5)
  cmpMax: 4
};
const PHASE = { P: 'Powerplay', M: 'Middle', D: 'Death' };
const PHASE_OVERS = { P: 'overs 1–6', M: 'overs 7–15', D: 'overs 16–20' };
const BUCKET = { H: 'High', M: 'Medium', L: 'Low' };
const ROLE_LABEL = { bat: 'Batters', bowl: 'Bowlers', ar: 'All-rounders' };
const ROLE_ONE = { bat: 'batter', bowl: 'bowler', ar: 'all-rounder' };

const METRIC_HELP = {
  score: 'Clutch Reliability Score, 0–100 within role (roughly a percentile). A historical pressure-performance indicator. Not a forecast for 2027.',
  range: '80% range: we are 80% sure the true score sits between the two ends of the whisker (from resampling the player’s matches). Wide = unsure.',
  hi: 'High-pressure sample: balls faced (batters) or legal balls bowled (bowlers) when the Pressure Index was High. More balls = more reliable.',
  rae: 'Runs Above Expected per 100 balls: runs scored minus what an average batter scores on the same balls in the same situations.',
  rse: 'Runs Saved vs Expected per 100 balls: runs an average bowler would concede minus what this bowler conceded.',
  wpa: 'Win Probability Added: how much his balls moved his team’s chance of winning, in percentage points (pp). Shown here per ball.',
  gap: 'Pressure gap = High-pressure value minus Low-pressure value (per 100 balls). Positive = he is better when it matters. Negative = he fades.',
  cons: 'Consistency: how steadily he was above expected across seasons (0–100). Higher = more steady season to season.',
  skill: 'Skill: runs above (batters) or saved (bowlers) vs expected per 100 High-pressure balls, pulled toward average when the sample is small.',
  sr: 'Strike rate = runs per 100 balls faced.',
  econ: 'Economy = runs conceded per 6 legal balls (an over).',
  naive: 'Naive rank = ordering by plain strike rate (batters, higher is better) or economy (bowlers, lower is better) on pressure-scored balls.',
  risk: 'Risk tags: things that make this pick less certain (small sample, unknown age, injury status unknown).',
  avail: 'Availability is an assumption: the official retention and release lists could not be read here.',
  price: 'Price band is an assumption for planning only. Not a market fact.',
  pi: 'Pressure Index 0–100: how much a ball could swing the match, ranked against earlier balls. 80+ = High.',
  strength: 'Pressure strength: runs above expected (batting) or saved (bowling) per 100 High-pressure balls, recent seasons. Higher = better.',
  tooclose: 'Two players whose 80% ranges overlap. The data cannot say who is better, so we do not name a winner.'
};
function info(key, text) {
  const t = text || METRIC_HELP[key] || (D.glossary.find(g => g.term.toLowerCase().startsWith(key.toLowerCase())) || {}).meaning || '';
  return `<button type="button" class="i" data-tip="${esc(t)}" aria-label="Meaning: ${esc(t)}">i</button>`;
}

/* ===================== utils ===================== */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
const isN = v => typeof v === 'number' && isFinite(v);
const f0 = v => isN(v) ? String(Math.round(v) + 0) : '—';
const f1 = v => isN(v) ? (Math.round(v * 10) / 10).toFixed(1) : '—';
const f2 = v => isN(v) ? (Math.round(v * 100) / 100).toFixed(2) : '—';
const sg = (v, f) => isN(v) ? (v > 0 ? '+' : v < 0 ? '−' : '') + (f || f1)(Math.abs(v)) : '—';
const thou = v => isN(v) ? Math.round(v).toLocaleString('en-US') : '—';
const sum = (a, f) => a.reduce((s, x) => s + (f ? f(x) : x), 0);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const uniq = a => Array.from(new Set(a));
function tg(s) { // text with [TAGS] and UNKNOWN highlighted
  return esc(s).replace(/\bUNKNOWN\b/g, '<span class="unk">UNKNOWN</span>')
    .replace(/\[([^\]]+)\]/g, '<span class="tag assume">$1</span>');
}
const tagChip = (t, cls) => `<span class="tag ${cls || 'assume'}">${esc(t)}</span>`;
const P = new Map(D.players.map(p => [p.id, p]));
const BYNAME = new Map(D.players.map(p => [p.name, p]));
const SCORABLE = D.players.filter(p => p.scorable);
const plink = (id, label) => { const p = P.get(id); return `<button type="button" class="plink" data-player="${esc(id)}">${esc(label || (p ? p.name : id))}</button>`; };
const nm = id => (P.get(id) || {}).name || id;
const roleKey = p => p.role === 'Batter' ? 'bat' : p.role === 'Bowler' ? 'bowl' : p.role === 'All-rounder' ? 'ar' : null;
const mainBlock = p => p.ar || p.bat || p.bowl;
const SEASONS = uniq(D.agg.bat.map(r => r[1]).concat(D.agg.bowl.map(r => r[1]))).sort();
const originOf = p => p.overseas === true ? 'ovs' : p.overseas === false ? 'ind' : 'unk';
const originLabel = p => p.overseas === true ? 'Overseas' : p.overseas === false ? 'Indian' : 'Origin unknown';
function widthWord(w) { return w > CFG.wideRange ? 'a wide range: treat with caution' : w >= CFG.modRange ? 'a moderate range' : 'a fairly tight range'; }
const isWide = (lo, hi) => (hi - lo) > CFG.wideRange;
const overlap = (a, b) => a.lo <= b.hi && b.lo <= a.hi;
function verdict(p) { // rebuilt in the browser so rounding matches the displayed dial
  const rk = roleKey(p), b = p[rk];
  if (!b) return '';
  const s = b === p.ar ? p.ar : b; // same
  return `Ranked ${b.rank} of ${b.of} ${ROLE_LABEL[rk].toLowerCase()} on historical pressure performance (score ${f0(s.score)}, 80% range ${f0(s.lo)}–${f0(s.hi)}: ${widthWord(s.hi - s.lo)}). Past record only; not a forecast for 2027.`;
}

/* ===================== aggregated rows (filters re-slice these) ===================== */
const AGG = { bat: new Map(), bowl: new Map() };
(function () {
  const bc = D.agg.bat_cols, wc = D.agg.bowl_cols;
  D.agg.bat.forEach(r => { const o = {}; bc.forEach((c, i) => o[c] = r[i]); (AGG.bat.get(o.player_id) || AGG.bat.set(o.player_id, []).get(o.player_id)).push(o); });
  D.agg.bowl.forEach(r => { const o = {}; wc.forEach((c, i) => o[c] = r[i]); (AGG.bowl.get(o.player_id) || AGG.bowl.set(o.player_id, []).get(o.player_id)).push(o); });
})();

/* ===================== state ===================== */
const TABS = [
  ['summary', 'Summary'], ['pressure', 'Pressure Index'], ['leaderboard', 'Leaderboard'], ['compare', 'Player Compare'],
  ['squad', 'Squad Fit'], ['auction', 'Auction Board'], ['method', 'Method & Proof']
];
const FDEF = { role: 'all', phase: 'all', season: 'all', pressure: 'all', origin: 'all', avail: false, q: '' };
const S = {
  tab: 'summary', player: null, detail: false, openDeep: new Set(),
  f: Object.assign({}, FDEF), lb: 'bat', sort: { k: 'rank', d: 1 }, cmp: [], basket: [],
  match: 0, ball: null, mapInn: 1, calSeason: 'all', squadPlan: 'A', cmpInit: false
};
function defaultCompare() {
  return (D.meta.kpi.must_back || []).map(n => (BYNAME.get(n) || {}).id).filter(Boolean).slice(0, CFG.cmpMax);
}
function sliceActive() { return S.f.phase !== 'all' || S.f.season !== 'all' || S.f.pressure !== 'all'; }
function filtersActive() {
  const f = S.f, a = [];
  if (f.role !== 'all') a.push(['role', 'Role: ' + ROLE_LABEL[f.role]]);
  if (f.phase !== 'all') a.push(['phase', 'Phase: ' + PHASE[f.phase]]);
  if (f.season !== 'all') a.push(['season', 'Season: ' + f.season]);
  if (f.pressure !== 'all') a.push(['pressure', 'Pressure: ' + BUCKET[f.pressure]]);
  if (f.origin !== 'all') a.push(['origin', 'Origin: ' + ({ ind: 'Indian', ovs: 'Overseas', unk: 'Unknown' })[f.origin]]);
  if (f.avail) a.push(['avail', 'Available at auction only']);
  if (f.q.trim()) a.push(['q', 'Search: ' + f.q.trim()]);
  return a;
}
function passPlayer(p) {
  const f = S.f;
  if (f.role !== 'all') { const rk = roleKey(p); if (rk !== f.role) return false; }
  if (f.origin !== 'all' && originOf(p) !== f.origin) return false;
  if (f.avail && (p.core || p.in_rr)) return false;
  if (f.q.trim() && !p.name.toLowerCase().includes(f.q.trim().toLowerCase())) return false;
  return true;
}
function passNonRole(p) { const r = S.f.role; S.f.role = 'all'; const ok = passPlayer(p); S.f.role = r; return ok; }

/* slice stats from the pre-aggregated rows */
function sliceOf(id, kind, f) {
  f = f || S.f;
  const rows = (AGG[kind].get(id) || []).filter(r => (f.phase === 'all' || r.phase === f.phase) && (f.season === 'all' || r.season === +f.season) && (f.pressure === 'all' || r.bucket === f.pressure));
  const t = { n: 0, l: 0, r: 0, o: 0, f: 0, s: 0, d: 0, k: 0, bd: 0, x: 0, w: 0, inn: 0 };
  rows.forEach(r => { for (const k in t) if (isN(r[k])) t[k] += r[k]; });
  t.rows = rows.length;
  if (!t.n) return t;
  t.wpa = t.w * 100;                     // pp
  t.wpaPerBall = t.wpa / t.n;            // pp per ball
  t.rae100 = t.x / t.n * 100;
  if (kind === 'bat') { t.sr = t.r / t.n * 100; t.dotp = t.d / t.n * 100; t.bndp = (t.f + t.s) / t.n * 100; }
  else { t.econ = t.l ? t.r / t.l * 6 : null; t.dotp = t.d / t.n * 100; t.bndp = t.bd / t.n * 100; }
  return t;
}

/* ===================== hash ===================== */
function readHash() {
  const h = (location.hash || '').replace(/^#/, '');
  const q = new URLSearchParams(h);
  const tab = q.get('tab');
  S.tab = TABS.some(t => t[0] === tab) ? tab : 'summary';
  const pl = q.get('p');
  S.player = pl && P.has(pl) ? pl : null;
  const c = q.get('c');
  if (c) { S.cmp = c.split(',').filter(x => P.has(x) && P.get(x).scorable).slice(0, CFG.cmpMax); S.cmpInit = true; }
  const lb = q.get('lb'); if (['bat', 'bowl', 'ar'].includes(lb)) S.lb = lb;
}
let hashLock = false;
function writeHash() {
  const q = new URLSearchParams();
  q.set('tab', S.tab);
  if (S.player) q.set('p', S.player);
  if (S.tab === 'compare' && S.cmp.length) q.set('c', S.cmp.join(','));
  if (S.tab === 'leaderboard') q.set('lb', S.lb);
  const h = '#' + q.toString();
  if (location.hash !== h) { hashLock = true; location.hash = h; setTimeout(() => hashLock = false, 0); }
}

/* ===================== tooltip ===================== */
const tip = () => $('#tip');
function showTip(t) {
  const el = tip(); el.textContent = t.getAttribute('data-tip'); el.classList.add('on');
  const r = t.getBoundingClientRect(), w = el.offsetWidth, h = el.offsetHeight;
  let x = clamp(r.left + r.width / 2 - w / 2, 8, innerWidth - w - 8);
  let y = r.bottom + 8; if (y + h > innerHeight - 8) y = Math.max(8, r.top - h - 8);
  el.style.left = x + 'px'; el.style.top = y + 'px';
  el._for = t;
}
function hideTip() { const el = tip(); el.classList.remove('on'); el._for = null; }

function sowhat(t) { return `<p class="sowhat"><b>So what for RR:</b> ${t}</p>`; }
function chartCard(o) {

function emptyBox(msg) { return `<div class="empty" role="status">${msg}</div>`; }
function tierInfo(t) { return t === 'Must-Back' ? { sh: '●', cls: 't-must', name: 'Must-Back' } : t === 'Value Pick' ? { sh: '◆', cls: 't-value', name: 'Value Pick' } : { sh: '▲', cls: 't-gem', name: 'Hidden Gem' }; }
function tierBadge(t) { const i = tierInfo(t); return `<span class="${i.cls}"><span class="shape" aria-hidden="true">${i.sh}</span>${i.name}</span>`; }
const CW = () => Math.max(260, Math.min(980, ($('#view') ? $('#view').clientWidth : 360) - 30));
function rangeTag(lo, hi) { return isWide(lo, hi) ? tagChip('wide range', 'warn') : ''; }
function niceList(a) { return a.length <= 1 ? (a[0] || '') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1]; }
function riskTags(r) { return r ? esc(String(r).replace(/\s*\[([^\]]+)\]/g, ' ($1)')).split(';').map(x => x.trim()).filter(Boolean).map(x => `<span class="tag ${/UNKNOWN|unknown/.test(x) ? 'assume' : 'warn'}">${x.replace(/UNKNOWN/g, 'UNKNOWN')}</span>`).join('') : ''; }
function pctOf(pool, val) { // percentile of val within pool (mid-rank), 0-100
  const v = pool.filter(isN); if (!v.length || !isN(val)) return null;
  const lo = v.filter(x => x < val).length, eq = v.filter(x => x === val).length;
  return 100 * (lo + 0.5 * eq) / v.length;
}

/* ===================== chart helpers (hand-built inline SVG) ===================== */
const COL = { pink: '#E4007C', pinkL: '#ff6db6', blue: '#254AA5', blueL: '#8fb0ff', amber: '#ffc85a', grey: '#8d94b3', text: '#f1f3fb', muted: '#b4bde0', grid: '#34427f' };
const lin = (d0, d1, r0, r1) => v => d1 === d0 ? (r0 + r1) / 2 : r0 + (v - d0) / (d1 - d0) * (r1 - r0);
const svgOpen = (w, h, label) => `<svg class="svg" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${esc(label)}"><title>${esc(label)}</title>`;
const T = (x, y, s, cls, anchor, extra) => `<text x="${x}" y="${y}" class="${cls || 'ax'}" ${anchor ? `text-anchor="${anchor}"` : ''} ${extra || ''}>${esc(s)}</text>`;
function niceTicks(a, b, n) {
  const span = b - a, raw = span / (n || 5), mag = Math.pow(10, Math.floor(Math.log10(raw || 1)));
  const st = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw) || mag;
  const out = []; for (let v = Math.ceil(a / st) * st; v <= b + 1e-9; v += st) out.push(+v.toFixed(6)); return out;
}
/* marker shapes: circle, diamond, triangle, square */
function marker(shape, x, y, r, fill, stroke, extra) {
  const s = stroke ? `stroke="${stroke}" stroke-width="1.5"` : '';
  if (shape === 'diamond') return `<polygon points="${x},${y - r * 1.2} ${x + r * 1.2},${y} ${x},${y + r * 1.2} ${x - r * 1.2},${y}" fill="${fill}" ${s} ${extra || ''}/>`;
  if (shape === 'triangle') return `<polygon points="${x},${y - r * 1.2} ${x + r * 1.15},${y + r} ${x - r * 1.15},${y + r}" fill="${fill}" ${s} ${extra || ''}/>`;
  if (shape === 'square') return `<rect x="${x - r}" y="${y - r}" width="${2 * r}" height="${2 * r}" fill="${fill}" ${s} ${extra || ''}/>`;
  return `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" ${s} ${extra || ''}/>`;
}
const TIER_SHAPE = { 'Must-Back': 'circle', 'Value Pick': 'diamond', 'Hidden Gem': 'triangle' };
const TIER_FILL = { 'Must-Back': 'url(#p-pink)', 'Value Pick': 'url(#p-hatch)', 'Hidden Gem': 'url(#p-amber)' };
const TIER_STROKE = { 'Must-Back': COL.pinkL, 'Value Pick': COL.blueL, 'Hidden Gem': COL.amber };
function legendMark(shape, fill, stroke, label) { return `<span><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">${marker(shape, 9, 9, 6, fill, stroke)}</svg>${esc(label)}</span>`; }

/* ---- bar + whisker (0-100 score scale, bars start at 0) ---- */
function scoreAxisSvg(w, label) {
  const x0 = 6, x1 = w - 10, sx = lin(0, 100, x0, x1);
  let s = svgOpen(w, 40, 'Score axis ' + label);
  [0, 25, 50, 75, 100].forEach(v => { s += `<line class="gl" x1="${sx(v)}" x2="${sx(v)}" y1="16" y2="22"/>` + T(sx(v), 14, v, 'ax', 'middle'); });
  s += `<line class="gl" x1="${x0}" x2="${x1}" y1="22" y2="22"/>` + T((x0 + x1) / 2, 37, label, 'axl', 'middle');
  return s + '</svg>';
}
function whiskerRowSvg(w, it) { // it: score, lo, hi, small, tier
  const x0 = 6, x1 = w - 10, sx = lin(0, 100, x0, x1), y = 16, h = 14;
  const fill = it.small ? 'url(#p-grey)' : (it.fill || 'url(#p-hatch)');
  let s = svgOpen(w, 32, `${it.label || ''} score ${f0(it.score)}, 80% range ${f0(it.lo)} to ${f0(it.hi)}`);
  [0, 50, 100].forEach(v => s += `<line class="gl" x1="${sx(v)}" x2="${sx(v)}" y1="2" y2="30" stroke-dasharray="2 3"/>`);
  s += `<rect x="${x0}" y="${y - h / 2}" width="${Math.max(1, sx(it.score) - x0)}" height="${h}" fill="${fill}" stroke="${it.stroke || COL.blueL}" stroke-width="1" rx="2"/>`;
  s += `<line x1="${sx(it.lo)}" x2="${sx(it.hi)}" y1="${y}" y2="${y}" stroke="${COL.text}" stroke-width="2.2"/>`;
  s += `<line x1="${sx(it.lo)}" x2="${sx(it.lo)}" y1="${y - 7}" y2="${y + 7}" stroke="${COL.text}" stroke-width="2.2"/><line x1="${sx(it.hi)}" x2="${sx(it.hi)}" y1="${y - 7}" y2="${y + 7}" stroke="${COL.text}" stroke-width="2.2"/>`;
  s += marker(it.shape || 'circle', sx(it.score), y, 5, '#fff', COL.pink);
  return s + '</svg>';
}
function whiskerChart(items, opt) {
  const w = CW();
  let h = scoreAxisSvg(w, opt.axis || 'Clutch score (0–100) with 80% range');
  items.forEach(it => {
    h += `<div class="wrow ${it.small ? 'small-s' : ''}"><div class="wh"><span>${it.name}</span><span class="wm">${it.meta || ''}</span></div>${whiskerRowSvg(w, it)}</div>`;
  });
  return `<div style="min-width:0">${h}</div>`;
}

/* ---- generic line/scatter plot frame ---- */
function plotFrame(o) { // o: w,h, m{l,r,t,b}, x:[a,b], y:[a,b], xt, yt, xlabel, ylabel, xfmt, yfmt
  const m = o.m || { l: 46, r: 12, t: 10, b: 42 };
  const sx = lin(o.x[0], o.x[1], m.l, o.w - m.r), sy = lin(o.y[0], o.y[1], o.h - m.b, m.t);
  let s = '';
  (o.yt || niceTicks(o.y[0], o.y[1], 5)).forEach(v => { s += `<line class="gl" x1="${m.l}" x2="${o.w - m.r}" y1="${sy(v)}" y2="${sy(v)}"/>` + T(m.l - 6, sy(v) + 4, (o.yfmt || (z => z))(v), 'ax', 'end'); });
  (o.xt || niceTicks(o.x[0], o.x[1], 6)).forEach(v => { s += `<line class="gl" x1="${sx(v)}" x2="${sx(v)}" y1="${o.h - m.b}" y2="${o.h - m.b + 5}"/>` + T(sx(v), o.h - m.b + 18, (o.xfmt || (z => z))(v), 'ax', 'middle'); });
  s += `<line x1="${m.l}" x2="${o.w - m.r}" y1="${o.h - m.b}" y2="${o.h - m.b}" stroke="${COL.muted}"/><line x1="${m.l}" x2="${m.l}" y1="${m.t}" y2="${o.h - m.b}" stroke="${COL.muted}"/>`;
  s += T((m.l + o.w - m.r) / 2, o.h - 6, o.xlabel || '', 'axl', 'middle');
  s += `<text class="axl" transform="translate(12 ${(m.t + o.h - m.b) / 2}) rotate(-90)" text-anchor="middle">${esc(o.ylabel || '')}</text>`;
  return { s, sx, sy, m };
}

/* ---- line chart with markers, used for trends ---- */
function lineChart(o) { // series: [{name, pts:[[x,y,n]], shape, dash, color, big}], ref: [[x,y]] league line
  const w = o.w || CW(), h = o.h || 260;
  const xs = [], ys = [];
  o.series.forEach(se => se.pts.forEach(p => { xs.push(p[0]); if (isN(p[1])) ys.push(p[1]); }));
  (o.ref || []).forEach(p => { if (isN(p[1])) ys.push(p[1]); });
  ys.push(0);
  let y0 = Math.min(...ys), y1 = Math.max(...ys); const pad = (y1 - y0) * 0.08 || 1; y0 -= pad; y1 += pad;
  const fr = plotFrame({ w, h, x: [Math.min(...xs) - 0.3, Math.max(...xs) + 0.3], y: [y0, y1], xt: uniq(xs), xfmt: v => v, xlabel: o.xlabel, ylabel: o.ylabel, yfmt: o.yfmt, m: { l: 52, r: 12, t: 10, b: 42 } });
  let s = svgOpen(w, h, o.label || 'Line chart') + fr.s;
  s += `<line x1="${fr.m.l}" x2="${w - fr.m.r}" y1="${fr.sy(0)}" y2="${fr.sy(0)}" stroke="${COL.muted}" stroke-dasharray="5 3"/>`;
  if (o.ref && o.ref.length) {
    const rp = o.ref.filter(p => isN(p[1])).sort((a, b) => a[0] - b[0]);
    s += `<polyline fill="none" stroke="${COL.grey}" stroke-width="2" stroke-dasharray="2 4" points="${rp.map(p => fr.sx(p[0]) + ',' + fr.sy(p[1])).join(' ')}"/>`;
    rp.forEach(p => s += `<circle cx="${fr.sx(p[0])}" cy="${fr.sy(p[1])}" r="3" fill="${COL.grey}"/>`);
  }
  o.series.forEach(se => {
    const pts = se.pts.filter(p => isN(p[1]));
    s += `<polyline fill="none" stroke="${se.color}" stroke-width="2.5" ${se.dash ? `stroke-dasharray="${se.dash}"` : ''} points="${pts.map(p => fr.sx(p[0]) + ',' + fr.sy(p[1])).join(' ')}"/>`;
    pts.forEach(p => {
      const small = isN(p[2]) && p[2] < CFG.smallSlice;
      s += marker(se.shape, fr.sx(p[0]), fr.sy(p[1]), 5.5, small ? 'none' : se.color, se.color, `data-tip="${esc(`${se.name}, ${p[0]}: ${f1(p[1])}${isN(p[2]) ? ' per 100 balls, n=' + p[2] + ' balls' : ''}${small ? ' (small sample)' : ''}`)}" tabindex="0" class="hit"`);
    });
  });
  return s + '</svg>';
}

/* ---- heatmap ---- */
function heatmap(cells, o) { // cells: {c,r,v,n}; cols 1..20, rows 0..9
  const w = o.w, cols = o.cols, rows = o.rows, m = { l: 40, r: 6, t: 8, b: 44 };
  const cw = (w - m.l - m.r) / cols.length, ch = o.ch || 24, h = m.t + rows.length * ch + m.b;
  const vals = cells.map(c => c.v), lo = Math.min(...vals), hi = Math.max(...vals);
  const col = v => { const t = (v - lo) / (hi - lo || 1); const a = [18, 26, 70], b = [228, 0, 124]; const c = a.map((x, i) => Math.round(x + (b[i] - x) * t)); return `rgb(${c})`; };
  let s = svgOpen(w, h, o.label);
  const map = new Map(cells.map(c => [c.r + '_' + c.c, c]));
  rows.forEach((r, ri) => {
    s += T(m.l - 6, m.t + ri * ch + ch / 2 + 4, r, 'ax', 'end');
    cols.forEach((c, ci) => {
      const cell = map.get(r + '_' + c), x = m.l + ci * cw, y = m.t + ri * ch;
      if (!cell) { s += `<rect x="${x}" y="${y}" width="${cw - 1}" height="${ch - 1}" fill="#101634"/>`; return; }
      const sm = cell.n < CFG.minCell;
      s += `<rect class="hit" tabindex="0" x="${x}" y="${y}" width="${cw - 1}" height="${ch - 1}" fill="${sm ? 'url(#p-grey)' : col(cell.v)}" stroke="${sm ? COL.grey : 'none'}" data-tip="${esc(`Over ${c}, ${r} wickets down: average pressure ${f0(cell.v)}, ${cell.n} balls${sm ? ' (small sample)' : ''}`)}"/>`;
      if (cw >= 30 && !sm) s += T(x + cw / 2 - .5, y + ch / 2 + 4, f0(cell.v), 'ax', 'middle', 'style="fill:#fff;font-size:10.5px"');
    });
  });
  const step = cw < 20 ? 5 : 1;
  cols.forEach((c, ci) => { if (c === 1 || c % step === 0) s += T(m.l + ci * cw + cw / 2, m.t + rows.length * ch + 14, c, 'ax', 'middle'); });
  s += T(m.l + (w - m.l - m.r) / 2, h - 6, o.xlabel, 'axl', 'middle');
  s += `<text class="axl" transform="translate(11 ${m.t + rows.length * ch / 2}) rotate(-90)" text-anchor="middle">${esc(o.ylabel)}</text>`;
  return { svg: s + '</svg>', lo, hi, col };
}

/* ---- scatter / bubble ---- */
function scatter(o) { // pts:{x,y,r,shape,fill,stroke,tip,id}
  const w = o.w, h = o.h || 300;
  const xs = o.pts.map(p => p.x), ys = o.pts.map(p => p.y);
  let x0 = o.x ? o.x[0] : Math.min(...xs), x1 = o.x ? o.x[1] : Math.max(...xs), y0 = o.y ? o.y[0] : Math.min(...ys), y1 = o.y ? o.y[1] : Math.max(...ys);
  const px = (x1 - x0) * .05 || 1, py = (y1 - y0) * .05 || 1;
  if (!o.x) { x0 -= px; x1 += px; } if (!o.y) { y0 -= py; y1 += py; }
  const fr = plotFrame({ w, h, x: [x0, x1], y: [y0, y1], xlabel: o.xlabel, ylabel: o.ylabel, xfmt: o.xfmt, yfmt: o.yfmt, m: { l: 50, r: 12, t: 10, b: 44 } });
  let s = svgOpen(w, h, o.label) + fr.s;
  if (o.zone) { const z = o.zone; s += `<rect x="${fr.sx(z.x0)}" y="${fr.sy(z.y1)}" width="${fr.sx(z.x1) - fr.sx(z.x0)}" height="${fr.sy(z.y0) - fr.sy(z.y1)}" fill="rgba(89,214,162,.12)" stroke="#59d6a2" stroke-dasharray="5 4"/>` + T(fr.sx(z.x0) + 6, fr.sy(z.y1) + 16, z.label, 'axl', 'start', 'style="fill:#59d6a2"'); }
  if (o.vline != null) s += `<line x1="${fr.sx(o.vline)}" x2="${fr.sx(o.vline)}" y1="${fr.m.t}" y2="${h - fr.m.b}" stroke="${COL.muted}" stroke-dasharray="5 3"/>`;
  if (o.hline != null) s += `<line y1="${fr.sy(o.hline)}" y2="${fr.sy(o.hline)}" x1="${fr.m.l}" x2="${w - fr.m.r}" stroke="${COL.muted}" stroke-dasharray="5 3"/>`;
  o.pts.forEach(p => {
    s += marker(p.shape || 'circle', fr.sx(p.x), fr.sy(p.y), p.r || 5, p.fill || COL.blueL, p.stroke || COL.text, `fill-opacity="${p.op || .8}" class="hit" tabindex="0" data-tip="${esc(p.tip)}" ${p.id ? `data-player="${esc(p.id)}"` : ''}`);
  });
  return s + '</svg>';
}

/* ---- radar ---- */
function radar(axes, series, size) { // axes:[label], series:[{name,vals:[0-100|null],color,shape,dash}]
  const w = size, h = size, cx = w / 2, cy = h / 2 + 2, R = size / 2 - (size < 340 ? 92 : 96), n = axes.length;
  const ang = i => -Math.PI / 2 + i * 2 * Math.PI / n;
  const pt = (i, v) => [cx + R * v / 100 * Math.cos(ang(i)), cy + R * v / 100 * Math.sin(ang(i))];
  let s = svgOpen(w, h, 'Radar chart of percentiles within role');
  [25, 50, 75, 100].forEach(l => { s += `<polygon fill="none" stroke="${COL.grid}" points="${axes.map((_, i) => pt(i, l).join(',')).join(' ')}"/>`; s += T(cx + 3, cy - R * l / 100 + 3, l, 'ax', 'start', 'style="font-size:10px"'); });
  axes.forEach((a, i) => {
    const [x, y] = pt(i, 100); s += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="${COL.grid}"/>`;
    const [lx, ly] = pt(i, 118), an = Math.cos(ang(i)) > .3 ? 'start' : Math.cos(ang(i)) < -.3 ? 'end' : 'middle';
    const ln = []; let cur = ''; a.split(' ').forEach(wd => { if ((cur + ' ' + wd).trim().length > 13 && cur) { ln.push(cur); cur = wd; } else cur = (cur + ' ' + wd).trim(); }); ln.push(cur);
    ln.forEach((t, k) => s += T(lx, ly + 4 + (k - (ln.length - 1) / 2) * 12, t, 'axl', an, 'style="font-size:11px"'));
  });
  series.forEach(se => {
    const pts = se.vals.map((v, i) => pt(i, isN(v) ? v : 0));
    s += `<polygon points="${pts.map(p => p.join(',')).join(' ')}" fill="${se.color}" fill-opacity=".14" stroke="${se.color}" stroke-width="2.4" ${se.dash ? `stroke-dasharray="${se.dash}"` : ''}/>`;

  });

}

/* ---- dial (semicircle) with 80% arc ---- */
function dial(score, lo, hi) {
  const w = 240, h = 140, cx = 120, cy = 122, R = 88;
  const pt = (v, r) => { const a = Math.PI * (1 - v / 100); return [cx + r * Math.cos(a), cy - r * Math.sin(a)]; };

  s += `<path d="${arc(0, 100, R)}" fill="none" stroke="${COL.grid}" stroke-width="14"/>`;
  s += `<path d="${arc(0, Math.max(score, .5), R)}" fill="none" stroke="${COL.pink}" stroke-width="14"/>`;
  s += `<path d="${arc(lo, Math.max(hi, lo + .5), R + 13)}" fill="none" stroke="${COL.blueL}" stroke-width="5"/>`;

  s += `<line x1="${nx}" y1="${ny}" x2="${bx}" y2="${by}" stroke="${COL.pink}" stroke-width="5"/>` + marker('circle', pt(score, R)[0], pt(score, R)[1], 8, '#fff', COL.pink);

}

function lbData(role) {

  if (role !== 'ar') {
    const key = role === 'bat' ? ((a, b) => b.naive - a.naive) : ((a, b) => a.naive - b.naive);
    rows.slice().sort(key).forEach((r, i) => r.nrank = i + 1);
  }

    if (role === 'bat') { r.hl = r.p.bat_hl || {}; r.sl = sliceOf(r.id, 'bat'); r.hiN = r.p.hi_faced; r.gap = r.hl.pressure_drop_per100; r.wpaH = r.hl.High_wpa_per100; r.raeH = r.hl.High_rae_per100; }
    else if (role === 'bowl') { r.hl = r.p.bowl_hl || {}; r.sl = sliceOf(r.id, 'bowl'); r.hiN = r.p.hi_bowled; r.gap = r.hl.pressure_drop_per100; r.wpaH = r.hl.High_wpa_per100; r.raeH = r.hl.High_rse_per100; }
    else { r.slb = sliceOf(r.id, 'bat'); r.slw = sliceOf(r.id, 'bowl'); r.hiN = (r.p.hi_faced || 0) + (r.p.hi_bowled || 0); }

}

function slTxt(sl, kind) {

function sortVal(r, k, role) {
  switch (k) {
    case 'rank': return r.rank; case 'name': return r.p.name.toLowerCase(); case 'hi': return r.hiN;
    case 'sln': return role === 'ar' ? ((r.slb && r.slb.n) || 0) + ((r.slw && r.slw.n) || 0) : (r.sl ? r.sl.n : 0);
    case 'slrae': return r.sl && r.sl.n ? r.sl.rae100 : -1e9;

    case 'wpa': return isN(r.wpaH) ? r.wpaH : -1e9; case 'gap': return isN(r.gap) ? r.gap : -1e9; case 'cons': return isN(r.cons) ? r.cons : -1e9;
  }
  return r.rank;
}
const SORT_OPTS = { rank: 'Clutch rank', name: 'Name', hi: 'High-pressure balls', sln: 'Balls in slice', slrae: 'Runs vs expected in slice', sluse: 'Strike rate / economy in slice', wpa: 'WPA (High pressure)', gap: 'Pressure gap', cons: 'Consistency' };

function tabLeaderboard() {

  const sel = `<div class="tools"><div class="seg" role="group" aria-label="Role">${['bat', 'bowl', 'ar'].map(k => `<button type="button" data-act="lbrole" data-v="${k}" aria-pressed="${S.lb === k}">${ROLE_LABEL[k]}</button>`).join('')}</div>

function methodAdds(all, role) {

  };

    sub: `Each player’s rank by plain ${role === 'bat' ? 'strike rate' : 'economy'} (square) against rank by Clutch Score (circle). The 6 biggest risers and 6 biggest fallers.`,
    svg: ax + list.map(rowHtml).join(''), n: `n = ${N} ${ROLE_LABEL[role].toLowerCase()} scored. Ranks are fixed and do not change with filters.`,

function axisSet(ps) {

function cmpVerdict(ps) {

function basketStats() {

   <h4 style="margin-top:14px">Glossary</h4><dl class="kv">${D.glossary.map(g => `<dt>${esc(g.term)}</dt><dd>${esc(g.meaning)}</dd>`).join('')}</dl>
   <h4 style="margin-top:14px">Step 8 audit</h4>${me.audit && me.audit.length ? auditTbl(me.audit) : '<p class="muted"><b>Pending.</b> The audit table is not in the data yet.</p>'}`)}
   <div class="card"><h3>Build stamp</h3><dl class="kv"><dt>Last match in data</dt><dd>${esc(me.stamp.last_match)}</dd><dt>Build date</dt><dd>${esc(me.stamp.build)}</dd><dt>Random seed</dt><dd>${esc(me.stamp.seed)}</dd><dt>Data fingerprint</dt><dd class="mono">${esc(me.stamp.data_sha256)}</dd></dl></div></section>`;
}
function tooCloseTbl(tc) {
  const rows = Array.isArray(tc) ? tc : [];
  if (!rows.length) return '';
  return `<h4 style="margin-top:14px">Top-10 pairs separated by 80% ranges</h4><div class="tw"><table><thead><tr><th>Role</th><th class="num">Top-10 pairs</th><th class="num">Separated by ranges</th><th class="num">Too close to call</th></tr></thead><tbody>${rows.map(r => `<tr><td data-l="Role">${r.role === 'bat' ? 'Batters' : r.role === 'bowl' ? 'Bowlers' : esc(r.role)}</td><td class="num" data-l="Pairs">${f0(r.top10_pairs)}</td><td class="num" data-l="Separated">${f0(r.pairs_separated_by_80pct_ranges)}</td><td class="num" data-l="Too close">${f0(r.pairs_too_close_to_call)}</td></tr>`).join('')}</tbody></table></div>`;
}
function auditTbl(a) {
  if (!Array.isArray(a) || !a.length) return '<p class="muted"><b>Pending.</b></p>';
  const cols = Object.keys(a[0]);
  return `<div class="tw"><table class="rt"><thead><tr>${cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${a.map(r => `<tr>${cols.map(c => `<td data-l="${esc(c)}">${esc(typeof r[c] === 'object' ? JSON.stringify(r[c]) : r[c])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}

/* ===================== render + events ===================== */
const TAB_FN = { summary: tabSummary, pressure: tabPressure, leaderboard: tabLeaderboard, compare: tabCompare, squad: tabSquad, auction: tabAuction, method: tabMethod };
let lastTab = null, lastW = 0, returnFocus = null;

function buildChrome() {
  $('#brand-name').textContent = D.meta.name;
  $('#brand-thesis').textContent = D.meta.thesis;
  $('#honest').innerHTML = `<b>Read with care:</b> ${esc(KPI.claim)} <button type="button" class="plink" data-goto="method">See the backtest</button>`;
  $('#tabs').innerHTML = TABS.map((t, i) => `<button type="button" role="tab" data-tab="${t[0]}" aria-selected="false"><span class="n">${i + 1}</span>${esc(t[1])}</button>`).join('');
  $('#f-season').innerHTML = '<option value="all">All seasons</option>' + SEASONS.map(s => `<option value="${s}">${s}</option>`).join('');
  $('#fnote').textContent = 'The Clutch Score does not change with filters. Filters re-slice the descriptive numbers (balls, strike rate, economy, runs vs expected, WPA) and which players are listed.';
  $('#avail-i').setAttribute('data-tip', 'Assumption: hides players tagged likely retained [A3] and players already in RR’s 2026 group [A1]. Real availability is UNKNOWN [A2]: the official lists could not be read.');
  $('#foot').innerHTML = `<p><b>${esc(D.meta.name)}</b> — ${esc(KPI.claim)}</p>
   <p>Last match in data: ${esc(D.meta.last_match)} · Build: ${esc(D.meta.build)} · Seed: ${esc(D.meta.seed)} · Data fingerprint: <span class="mono">${esc(D.meta.data_sha256)}</span></p>
   <p>No external fact is VERIFIED in this project: ages, prices, availability and nationality are assumptions or UNKNOWN (network policy blocked verification).</p>
   <p>Public URL: pending (placeholder)</p>`;
}
function syncFilterUI() {
  const f = S.f;
  ['role', 'phase', 'season', 'pressure', 'origin'].forEach(k => { const e = $('#f-' + k); if (e.value !== String(f[k])) e.value = f[k]; });
  $('#f-avail').checked = f.avail;
  if ($('#f-q') !== document.activeElement) $('#f-q').value = f.q;
  const act = filtersActive();
  $('#fcount').textContent = act.length;
  $('#activebar').innerHTML = act.length ? `<span class="muted small">Active filters:</span>${act.map(a => `<span class="chip">${esc(a[1])}</span>`).join('')}<button type="button" class="btn sm" data-act="reset">Reset</button>` : '';
}
function setTabsUI() {
  $$('#tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === S.tab)));
  const act = $('#tabs button[aria-selected=true]'); if (act && act.scrollIntoView) { const c = $('#tabs'); const l = act.offsetLeft - 8; if (Math.abs(c.scrollLeft - l) > c.clientWidth * .6) c.scrollLeft = l; }
}
function render(keepScroll) {
  const y = window.scrollY, same = lastTab === S.tab;
  document.body.classList.toggle('detailed', S.detail);
  $('#mode-simple').setAttribute('aria-pressed', String(!S.detail)); $('#mode-detail').setAttribute('aria-pressed', String(S.detail));
  syncFilterUI(); setTabsUI();
  let html;
  try { html = TAB_FN[S.tab](); } catch (e) { console.error(e); html = emptyBox('Something went wrong drawing this tab: ' + esc(e.message)); }
  $('#view').innerHTML = html;
  lastTab = S.tab; lastW = $('#view').clientWidth;
  document.title = D.meta.name + ' — ' + (TABS.find(t => t[0] === S.tab) || [])[1];
  if (keepScroll && same) window.scrollTo(0, y); else if (!keepScroll) window.scrollTo(0, 0);
}
function setTab(t, anchor) {
  S.tab = t; writeHash(); render(false); hideTip();
  if (anchor) { const e = document.getElementById(anchor); if (e) { const d = e.querySelector('details.deep'); if (d) { d.open = true; S.openDeep.add(d.dataset.dk); } e.scrollIntoView(); } }
}
function openPlayer(id) { returnFocus = document.activeElement; S.player = id; writeHash(); renderCard(); hideTip(); }
function closeCard() { S.player = null; writeHash(); renderCard(); if (returnFocus && returnFocus.focus && document.contains(returnFocus)) returnFocus.focus(); }
function renderCard() {
  const c = $('#card'), p = S.player && P.get(S.player);
  if (!p) { c.classList.remove('on'); document.body.style.overflow = ''; return; }
  const was = c.classList.contains('on');
  $('#cardpanel').innerHTML = cardHtml(p);
  c.classList.add('on'); document.body.style.overflow = 'hidden';
  if (!was) { $('#cardpanel').scrollTop = 0; const b = $('#card-close'); if (b) b.focus(); }
  c.setAttribute('aria-label', 'Player profile: ' + p.name);
}
function moveBall(i) {
  const svg = $('#mx'); if (!svg) return;
  const m = D.pressure.showcase[S.match], N = +svg.dataset.n, w = +svg.dataset.w, h = +svg.dataset.h;
  i = clamp(Math.round(i), 0, N - 1); S.ball = i;
  const x = lin(0, N - 1, 46, w - 10)(i), y = lin(0, 1, h - 40, 10)(m.balls[i][2]);
  const l = $('#mx-line'), d = $('#mx-dot');
  l.setAttribute('x1', x); l.setAttribute('x2', x); l.removeAttribute('display'); d.setAttribute('cx', x); d.setAttribute('cy', y); d.removeAttribute('display');
  $('#ballinfo').innerHTML = ballInfo(m, i); const sl = $('#ballslider'); if (sl) sl.value = i;
}
function setFilter(k, v) { S.f[k] = v; if (k === 'role' && v !== 'all') S.lb = v; render(true); }
function resetFilters() { S.f = Object.assign({}, FDEF); render(true); }
function addCompare(id) { if (!S.cmp.includes(id) && S.cmp.length < CFG.cmpMax) S.cmp.push(id); S.cmpInit = true; S.player = null; S.tab = 'compare'; writeHash(); renderCard(); render(false); }
function toggleBasket(id) { const i = S.basket.indexOf(id); if (i >= 0) S.basket.splice(i, 1); else S.basket.push(id); if (S.player) renderCard(); render(true); }

document.addEventListener('click', e => {
  const t = e.target;
  const tipEl = t.closest('[data-tip]');
  const pl = t.closest('[data-player]');
  if (pl) { openPlayer(pl.dataset.player); return; }
  if (tipEl) { if (tip().classList.contains('on') && tip()._for === tipEl) hideTip(); else showTip(tipEl); e.preventDefault(); return; }
  if (!t.closest('#tip')) hideTip();
  const g = t.closest('[data-goto]'); if (g) { setTab(g.dataset.goto, g.dataset.anchor); return; }
  const tb = t.closest('#tabs button'); if (tb) { setTab(tb.dataset.tab); return; }
  const a = t.closest('[data-act]'); if (!a) return;
  const v = a.dataset.v, id = a.dataset.id;
  switch (a.dataset.act) {
    case 'close-card': closeCard(); break;
    case 'reset': resetFilters(); break;
    case 'mapinn': S.mapInn = +v; render(true); break;
    case 'calseason': S.calSeason = v; render(true); break;
    case 'lbrole': S.lb = v; if (S.f.role !== 'all') S.f.role = v; writeHash(); render(true); break;
    case 'sortby': S.sort = { k: v, d: S.sort.k === v ? -S.sort.d : 1 }; render(true); break;
    case 'sortdir': S.sort.d = -S.sort.d; render(true); break;
    case 'plan': S.squadPlan = v; render(true); break;
    case 'basket': toggleBasket(id); break;
    case 'bk-preset': S.basket = (v === 'A' ? D.squad.planA_ids : D.squad.planB_ids).slice(); render(true); break;
    case 'bk-clear': S.basket = []; render(true); break;
    case 'cmp-remove': S.cmp = S.cmp.filter(x => x !== id); S.cmpInit = true; writeHash(); render(true); break;
    case 'cmp-preset': S.cmp = (v === 'must' ? defaultCompare() : D.auction.planA.slice(0, CFG.cmpMax)); S.cmpInit = true; writeHash(); render(true); break;
    case 'compare-add': addCompare(id); break;
  }
});
document.addEventListener('mouseover', e => { if (!matchMedia('(hover:hover)').matches) return; const t = e.target.closest && e.target.closest('[data-tip]'); if (t && !t.classList.contains('i')) showTip(t); });
document.addEventListener('mouseout', e => { if (!matchMedia('(hover:hover)').matches) return; const t = e.target.closest && e.target.closest('[data-tip]'); if (t && !t.classList.contains('i')) hideTip(); });
document.addEventListener('focusin', e => { const t = e.target.closest && e.target.closest('[data-tip]'); if (t && t.tagName !== 'BUTTON') showTip(t); });
document.addEventListener('focusout', e => { const t = e.target.closest && e.target.closest('[data-tip]'); if (t && t.tagName !== 'BUTTON') hideTip(); });
document.addEventListener('toggle', e => { const d = e.target; if (d.matches && d.matches('details.deep')) { if (d.open) S.openDeep.add(d.dataset.dk); else S.openDeep.delete(d.dataset.dk); } }, true);
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.sel === 'match') { S.match = +t.value; S.ball = null; render(true); }
  else if (t.dataset.sel === 'sort') { S.sort = { k: t.value, d: 1 }; render(true); }
  else if (t.dataset.sel === 'cmpadd') { if (t.value) addCompare(t.value); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'ballslider') moveBall(+t.value);
});
document.addEventListener('pointerdown', e => {
  const h = e.target.closest && e.target.closest('#mx-hit'); if (!h) return;
  const svg = $('#mx'), mv = ev => { const r = svg.getBoundingClientRect(), w = +svg.dataset.w, N = +svg.dataset.n; const x = (ev.clientX - r.left) * (w / r.width); moveBall((x - 46) / (w - 56) * (N - 1)); };
  mv(e);
  const up = () => { document.removeEventListener('pointermove', mv); document.removeEventListener('pointerup', up); };
  document.addEventListener('pointermove', mv); document.addEventListener('pointerup', up);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (S.player) closeCard(); else if ($('#fbar').classList.contains('open')) toggleSheet(false); hideTip(); }
});
function toggleSheet(on) { $('#fbar').classList.toggle('open', on); $('#scrim').classList.toggle('on', on); $('#fbtn').setAttribute('aria-expanded', String(on)); }
$('#fbtn').addEventListener('click', () => toggleSheet(!$('#fbar').classList.contains('open')));
$('#fclose').addEventListener('click', () => toggleSheet(false));
$('#scrim').addEventListener('click', () => toggleSheet(false));
['role', 'phase', 'season', 'pressure', 'origin'].forEach(k => $('#f-' + k).addEventListener('change', e => setFilter(k, e.target.value)));
$('#f-avail').addEventListener('change', e => setFilter('avail', e.target.checked));
$('#f-q').addEventListener('input', e => setFilter('q', e.target.value));
$('#f-reset').addEventListener('click', resetFilters);
$('#mode-simple').addEventListener('click', () => { S.detail = false; render(true); });
$('#mode-detail').addEventListener('click', () => { S.detail = true; render(true); });
window.addEventListener('hashchange', () => { if (hashLock) return; const t = S.tab; readHash(); if (t !== S.tab) render(false); else render(true); renderCard(); });
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { const w = $('#view').clientWidth; if (Math.abs(w - lastW) > 8) { render(true); if (S.player) renderCard(); } }, 160); });

/* ===================== init ===================== */
readHash();
buildChrome();
if (!location.hash) { try { history.replaceState(null, '', '#tab=' + S.tab); } catch (e) { /* ignore */ } }
render(false);
renderCard();

</script>
</body>
</html>
